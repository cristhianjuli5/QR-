<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR Profesional con Consecutivo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            --border-focus: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: var(--bg-color);
        }

        .header {
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 2rem;
        }

        .controls-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            align-content: start;
        }

        .qr-display {
            position: sticky;
            top: 2rem;
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            height: fit-content;
        }

        .section {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
        }

        .section h3 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="password"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-main);
            font-size: 0.875rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .color-matrix {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .color-input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            background: none;
        }

        input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
        input[type="color"]::-webkit-color-swatch { border-radius: 4px; border: none; }

        .slider-group { margin-bottom: 1.25rem; }
        .slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .slider-value {
            font-size: 0.75rem; font-weight: 600; color: var(--primary);
            background: rgba(59, 130, 246, 0.1); padding: 0.25rem 0.5rem; border-radius: 4px;
        }

        input[type="range"] {
            width: 100%; height: 6px; background: var(--bg-color);
            border: 1px solid var(--border); border-radius: 3px; appearance: none; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            appearance: none; width: 16px; height: 16px; border-radius: 50%;
            background: var(--primary); cursor: pointer; transition: transform 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.1); }

        .toggle-group { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .toggle-btn {
            padding: 0.5rem 1rem; background: var(--bg-color); border: 1px solid var(--border);
            border-radius: var(--radius-md); color: var(--text-muted); font-size: 0.875rem;
            cursor: pointer; transition: all 0.2s;
        }
        .toggle-btn:hover { background: var(--surface-hover); color: var(--text-main); }
        .toggle-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        .logo-upload {
            border: 1px dashed var(--border); padding: 2rem; text-align: center;
            border-radius: var(--radius-md); cursor: pointer; background: var(--bg-color);
            transition: all 0.2s; color: var(--text-muted); font-size: 0.875rem;
        }
        .logo-upload:hover { border-color: var(--primary); color: var(--text-main); }
        .logo-upload.has-image { border-color: var(--success); border-style: solid; }

        .qr-canvas {
            border-radius: var(--radius-md); background: #ffffff; max-width: 100%;
            height: auto; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .download-btn {
            width: 100%; margin-top: 1.5rem; padding: 1rem; background-color: var(--primary);
            color: #ffffff; border: none; border-radius: var(--radius-md); font-size: 1rem;
            font-weight: 500; cursor: pointer; transition: background-color 0.2s;
        }
        .download-btn:hover { background-color: var(--primary-hover); }

        .messages { width: 100%; margin-top: 1rem; font-size: 0.875rem; }
        .message { padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 0.5rem; }
        .message.success { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .message.error { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

        .checkbox-label { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-main); font-weight: 500; }
        .checkbox-label input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        @media (max-width: 1024px) {
            .main-content { grid-template-columns: 1fr; }
            .qr-display { position: relative; top: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Generador QR Avanzado</h1>
            <p>Producción de códigos estáticos y en lote con diseño paramétrico.</p>
        </header>

        <div class="main-content">
            <div class="controls-panel">
                
                <div class="section">
                    <h3>Datos y Estructura</h3>
                    <div class="grid-2">
                        <div class="form-group">
                            <label for="qrType">Tipo de Datos</label>
                            <select id="qrType">
                                <option value="url">URL / Enlace</option>
                                <option value="text">Texto Libre</option>
                                <option value="email">Correo Electrónico</option>
                                <option value="phone">Teléfono</option>
                                <option value="wifi">Red Wi-Fi</option>
                                <option value="vcard">Contacto vCard</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="errorCorrection">Corrección de Errores</label>
                            <select id="errorCorrection">
                                <option value="L">Bajo (7%)</option>
                                <option value="M">Medio (15%)</option>
                                <option value="Q" selected>Alto (25%)</option>
                                <option value="H">Máximo (30%)</option>
                            </select>
                        </div>
                    </div>

                    <div id="contentInputs">
                        <div class="form-group">
                            <label for="qrContent">Destino Base</label>
                            <textarea id="qrContent" rows="3" placeholder="https://ejemplo.com"></textarea>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                        <label class="checkbox-label">
                            <input type="checkbox" id="enableSequence">
                            Habilitar Producción en Lote (Consecutivos)
                        </label>
                        
                        <div id="sequenceConfig" style="display: none; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem;">
                            <!-- Nuevos campos agregados -->
                            <div class="form-group">
                                <label>Hostname / Equipo</label>
                                <input type="text" id="seqHostname" placeholder="Ej: Mac Studio Fotografía">
                            </div>
                            <div class="form-group">
                                <label>Responsable</label>
                                <input type="text" id="seqResponsable" placeholder="Ej: David Cano">
                            </div>
                            
                            <div class="form-group">
                                <label>Prefijo</label>
                                <input type="text" id="seqPrefix" placeholder="FDS-" value="FDS-">
                            </div>
                            <div class="form-group">
                                <label>Valor Actual</label>
                                <input type="number" id="seqValue" value="1" min="1">
                            </div>
                            <div class="form-group">
                                <label>Dígitos (Relleno de Ceros)</label>
                                <input type="number" id="seqPadding" value="3" min="1" max="10">
                            </div>
                            <div class="form-group">
                                <label>Comportamiento de Inyección</label>
                                <select id="seqAppendType">
                                    <option value="path">Añadir como ruta (/001)</option>
                                    <option value="query">Añadir como query (?id=001)</option>
                                    <option value="append">Concatenar al final texto</option>
                                </select>
                            </div>
                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label class="checkbox-label" style="font-size: 0.875rem;">
                                    <input type="checkbox" id="seqDrawLabel" checked>
                                    Imprimir etiquetas de texto (Responsable y Consecutivo) en la imagen
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3>Diseño Paramétrico</h3>
                    <div class="grid-2">
                        <div class="form-group">
                            <label for="bgColor">Color de Fondo</label>
                            <input type="color" id="bgColor" value="#ffffff">
                        </div>
                        <div class="form-group">
                            <label for="moduleShape">Morfología</label>
                            <select id="moduleShape">
                                <option value="square">Cuadrados</option>
                                <option value="rounded" selected>Redondeados</option>
                                <option value="circle">Circulares</option>
                            </select>
                        </div>
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <label>Margen Interno (Quiet Zone)</label>
                            <span class="slider-value" id="qrMarginValue">20px</span>
                        </div>
                        <input type="range" id="qrMargin" min="0" max="60" value="20">
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <label>Resolución de Salida</label>
                            <span class="slider-value" id="qrSizeValue">500px</span>
                        </div>
                        <input type="range" id="qrSize" min="300" max="1200" step="50" value="500">
                    </div>
                </div>

                <div class="section">
                    <h3>Colorimetría (Módulos)</h3>
                    <div class="color-matrix">
                        <div class="color-input-group">
                            <label>Color 1</label>
                            <input type="color" id="color1" value="#1e293b">
                        </div>
                        <div class="color-input-group">
                            <label>Color 2</label>
                            <input type="color" id="color2" value="#334155">
                        </div>
                        <div class="color-input-group">
                            <label>Color 3</label>
                            <input type="color" id="color3" value="#0f172a">
                        </div>
                        <div class="color-input-group">
                            <label>Color 4</label>
                            <input type="color" id="color4" value="#3b82f6">
                        </div>
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <label>Ángulo del Gradiente</label>
                            <span class="slider-value" id="angleValue">45°</span>
                        </div>
                        <input type="range" id="gradientAngle" min="0" max="360" value="45">
                    </div>

                    <div class="form-group">
                        <label>Modo de Fusión</label>
                        <div class="toggle-group" id="blendModes">
                            <button class="toggle-btn active" data-value="normal">Normal</button>
                            <button class="toggle-btn" data-value="multiply">Multiply</button>
                            <button class="toggle-btn" data-value="screen">Screen</button>
                            <button class="toggle-btn" data-value="overlay">Overlay</button>
                        </div>
                    </div>
                </div>

                <div class="section">
                    <h3>Integración de Marca</h3>
                    <div class="logo-upload" id="logoUpload">
                        <input type="file" id="logoInput" accept="image/png, image/jpeg, image/svg+xml" style="display: none;">
                        <span>Seleccionar archivo o arrastrar imagen</span><br>
                        <small style="opacity: 0.7; margin-top: 0.5rem; display: block;">PNG, JPG o SVG (Recomendado con transparencia)</small>
                    </div>
                    
                    <div class="form-group" style="margin-top: 1.5rem;">
                        <label>Método de Integración</label>
                        <div class="toggle-group" id="integrationModes">
                            <button class="toggle-btn active" data-value="cutout">Recorte Exacto</button>
                            <button class="toggle-btn" data-value="overlay">Capa Superpuesta</button>
                            <button class="toggle-btn" data-value="blend">Multiply Blend</button>
                        </div>
                    </div>

                    <div class="slider-group">
                        <div class="slider-header">
                            <label>Escala de Marca</label>
                            <span class="slider-value" id="logoSizeValue">20%</span>
                        </div>
                        <input type="range" id="logoSize" min="5" max="35" value="20">
                    </div>
                </div>
            </div>

            <div class="qr-display">
                <canvas id="qrCanvas"></canvas>
                <button class="download-btn" onclick="downloadQR()">Exportar y Auto-incrementar</button>
                <div id="messages" class="messages"></div>
            </div>
        </div>
    </div>

    <script>
        let currentQR = null;
        let logoImage = null;
        let selectedIntegration = 'cutout';
        let selectedBlendMode = 'normal';

        document.addEventListener('DOMContentLoaded', () => {
            initializeEventListeners();
            generateQR();
        });

        function initializeEventListeners() {
            // Inputs básicos
            const renderTriggers = [
                'qrContent', 'errorCorrection', 'bgColor', 'moduleShape',
                'color1', 'color2', 'color3', 'color4', 'seqDrawLabel'
            ];
            
            renderTriggers.forEach(id => {
                const el = document.getElementById(id);
                if(el) el.addEventListener('input', generateQR);
            });

            // Consecutivos toggle y inputs
            document.getElementById('enableSequence').addEventListener('change', (e) => {
                document.getElementById('sequenceConfig').style.display = e.target.checked ? 'grid' : 'none';
                generateQR();
            });

            // Añadidos seqHostname y seqResponsable a los triggers
            ['seqPrefix', 'seqValue', 'seqPadding', 'seqAppendType', 'seqHostname', 'seqResponsable'].forEach(id => {
                document.getElementById(id).addEventListener('input', generateQR);
            });

            document.getElementById('qrType').addEventListener('change', updateContentInputs);

            // Configuración de Sliders
            const sliders = {
                'qrSize': { display: 'qrSizeValue', suffix: 'px', callback: updateCanvasStyles },
                'qrMargin': { display: 'qrMarginValue', suffix: 'px', callback: generateQR },
                'gradientAngle': { display: 'angleValue', suffix: '°', callback: generateQR },
                'logoSize': { display: 'logoSizeValue', suffix: '%', callback: generateQR }
            };

            Object.entries(sliders).forEach(([id, config]) => {
                const slider = document.getElementById(id);
                const display = document.getElementById(config.display);
                if (slider && display) {
                    slider.addEventListener('input', (e) => {
                        display.textContent = e.target.value + config.suffix;
                        if(config.callback) config.callback();
                    });
                }
            });

            // Botones de Modo
            setupToggleGroup('blendModes', (val) => { selectedBlendMode = val; generateQR(); });
            setupToggleGroup('integrationModes', (val) => { selectedIntegration = val; generateQR(); });

            // Carga de Logo
            const uploadArea = document.getElementById('logoUpload');
            const fileInput = document.getElementById('logoInput');

            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = 'var(--primary)'; });
            uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = ''; });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault(); uploadArea.style.borderColor = '';
                if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });

            fileInput.addEventListener('change', (e) => {
                if(e.target.files.length) handleFile(e.target.files[0]);
            });
        }

        function setupToggleGroup(containerId, callback) {
            const container = document.getElementById(containerId);
            const buttons = container.querySelectorAll('.toggle-btn');
            
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    callback(btn.dataset.value);
                });
            });
        }

        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                showMessage('Formato de archivo no soportado.', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                logoImage = new Image();
                logoImage.onload = () => {
                    document.getElementById('logoUpload').classList.add('has-image');
                    document.getElementById('logoUpload').querySelector('span').textContent = 'Imagen cargada: ' + file.name;
                    generateQR();
                };
                logoImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateCanvasStyles() {
            const canvas = document.getElementById('qrCanvas');
            canvas.style.width = '100%';
            canvas.style.maxWidth = '400px';
            generateQR();
        }

        function updateContentInputs() {
            const type = document.getElementById('qrType').value;
            const container = document.getElementById('contentInputs');
            
            let html = '';
            switch(type) {
                case 'url': html = `<div class="form-group"><label>URL</label><input type="text" id="qrContent" value="https://"></div>`; break;
                case 'text': html = `<div class="form-group"><label>Contenido Textual</label><textarea id="qrContent" rows="4" placeholder="Ingresar datos..."></textarea></div>`; break;
                case 'email':
                    html = `<div class="form-group"><label>Dirección Email</label><input type="email" id="eAddr"></div>
                            <div class="form-group"><label>Asunto</label><input type="text" id="eSubj"></div>
                            <div class="form-group"><label>Cuerpo</label><textarea id="eBody" rows="2"></textarea></div>`; break;
                case 'phone': html = `<div class="form-group"><label>Número</label><input type="tel" id="pNum" placeholder="+1234567890"></div>`; break;
                case 'wifi':
                    html = `<div class="form-group"><label>SSID</label><input type="text" id="wSSID"></div>
                            <div class="form-group"><label>Contraseña</label><input type="password" id="wPass"></div>
                            <div class="form-group"><label>Seguridad</label><select id="wSec"><option value="WPA">WPA/WPA2</option><option value="WEP">WEP</option><option value="nopass">Abierta</option></select></div>`; break;
                case 'vcard':
                    html = `<div class="grid-2"><div class="form-group"><label>Nombre</label><input type="text" id="vName"></div>
                            <div class="form-group"><label>Empresa</label><input type="text" id="vOrg"></div>
                            <div class="form-group"><label>Tel</label><input type="tel" id="vPhone"></div>
                            <div class="form-group"><label>Email</label><input type="email" id="vEmail"></div></div>`; break;
            }
            
            container.innerHTML = html;
            container.querySelectorAll('input, textarea, select').forEach(el => {
                el.addEventListener('input', generateQR);
            });
            generateQR();
        }

        function getCurrentSequenceString() {
            if (!document.getElementById('enableSequence').checked) return "";
            const prefix = document.getElementById('seqPrefix').value;
            const val = document.getElementById('seqValue').value;
            const pad = document.getElementById('seqPadding').value;
            return prefix + String(val).padStart(pad, '0');
        }

        function getPayload() {
            const type = document.getElementById('qrType').value;
            let basePayload = ' ';
            
            try {
                switch(type) {
                    case 'url': 
                    case 'text': basePayload = document.getElementById('qrContent')?.value || ' '; break;
                    case 'email': basePayload = `mailto:${document.getElementById('eAddr')?.value || ''}?subject=${encodeURIComponent(document.getElementById('eSubj')?.value || '')}&body=${encodeURIComponent(document.getElementById('eBody')?.value || '')}`; break;
                    case 'phone': basePayload = `tel:${document.getElementById('pNum')?.value || ''}`; break;
                    case 'wifi': basePayload = `WIFI:T:${document.getElementById('wSec')?.value || 'WPA'};S:${document.getElementById('wSSID')?.value || ''};P:${document.getElementById('wPass')?.value || ''};;`; break;
                    case 'vcard': basePayload = `BEGIN:VCARD\nVERSION:3.0\nFN:${document.getElementById('vName')?.value || ''}\nORG:${document.getElementById('vOrg')?.value || ''}\nTEL:${document.getElementById('vPhone')?.value || ''}\nEMAIL:${document.getElementById('vEmail')?.value || ''}\nEND:VCARD`; break;
                }
            } catch(e) {}

            // Inyectar el consecutivo si está activo
            if (document.getElementById('enableSequence').checked && basePayload.trim() !== '') {
                const seqStr = getCurrentSequenceString();
                const appendType = document.getElementById('seqAppendType').value;
                
                if (type === 'url' || type === 'text') {
                    if (appendType === 'query') {
                        basePayload += (basePayload.includes('?') ? '&' : '?') + 'id=' + encodeURIComponent(seqStr);
                    } else if (appendType === 'path') {
                        basePayload += (basePayload.endsWith('/') ? '' : '/') + encodeURIComponent(seqStr);
                    } else {
                        basePayload += ' ' + seqStr;
                    }
                } else if (type === 'vcard') {
                    basePayload = basePayload.replace('END:VCARD', `NOTE:ID-${seqStr}\nEND:VCARD`);
                } else {
                    basePayload += ' ' + seqStr;
                }
            }
            
            return basePayload;
        }

        function generateQR() {
            if (typeof qrcode === 'undefined') return;

            const payload = getPayload();
            const errLevel = document.getElementById('errorCorrection').value;
            
            try {
                const qr = qrcode(0, errLevel);
                qr.addData(payload);
                qr.make();
                
                currentQR = qr;
                renderCanvas(qr);
            } catch (err) {
                console.warn("Generación pendiente: datos insuficientes.", err);
            }
        }

        function renderCanvas(qr) {
            const canvas = document.getElementById('qrCanvas');
            const ctx = canvas.getContext('2d');
            
            // Dimensiones principales
            const size = parseInt(document.getElementById('qrSize').value);
            const margin = parseInt(document.getElementById('qrMargin').value);
            const renderSize = size - (margin * 2);

            // Calcular áreas para etiquetas de texto
            const isSeqEnabled = document.getElementById('enableSequence').checked;
            const drawLabel = isSeqEnabled && document.getElementById('seqDrawLabel').checked;
            
            const hostname = isSeqEnabled ? document.getElementById('seqHostname').value.trim() : '';
            const responsable = isSeqEnabled ? document.getElementById('seqResponsable').value.trim() : '';
            
            const hasTopLabel = drawLabel && (hostname !== '' || responsable !== '');
            const topLabelHeight = hasTopLabel ? Math.max(80, size * 0.18) : 0;
            const bottomLabelHeight = drawLabel ? Math.max(40, size * 0.1) : 0;
            
            canvas.width = size;
            canvas.height = size + topLabelHeight + bottomLabelHeight;
            
            // Fondo general
            ctx.fillStyle = document.getElementById('bgColor').value;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const modules = qr.getModuleCount();
            const moduleSize = renderSize / modules;

            // Configurar el gradiente (ajustado al área del QR)
            const angle = parseInt(document.getElementById('gradientAngle').value);
            const rad = (angle * Math.PI) / 180;
            const x1 = size/2 - Math.cos(rad) * size/2;
            const y1 = topLabelHeight + size/2 - Math.sin(rad) * size/2;
            const x2 = size/2 + Math.cos(rad) * size/2;
            const y2 = topLabelHeight + size/2 + Math.sin(rad) * size/2;

            const gradient = ctx.createLinearGradient(x1, y1, x2, y2);
            gradient.addColorStop(0, document.getElementById('color1').value);
            gradient.addColorStop(0.33, document.getElementById('color2').value);
            gradient.addColorStop(0.66, document.getElementById('color3').value);
            gradient.addColorStop(1, document.getElementById('color4').value);

            ctx.globalCompositeOperation = selectedBlendMode;
            ctx.fillStyle = gradient;

            const shape = document.getElementById('moduleShape').value;
            const logoConfig = getLogoConfig(modules);

            // Dibujar QR con offset vertical
            for (let row = 0; row < modules; row++) {
                for (let col = 0; col < modules; col++) {
                    if (qr.isDark(row, col)) {
                        if (logoImage && selectedIntegration === 'cutout' && isInsideLogo(row, col, logoConfig)) {
                            continue; 
                        }
                        const x = margin + (col * moduleSize);
                        const y = topLabelHeight + margin + (row * moduleSize);
                        drawModuleShape(ctx, x, y, moduleSize, shape);
                    }
                }
            }

            ctx.globalCompositeOperation = 'source-over';

            if (logoImage) {
                renderLogo(ctx, size, margin, renderSize, topLabelHeight);
            }

            // Renderizar etiquetas superiores (Hostname y Responsable)
            if (hasTopLabel) {
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                let textY = topLabelHeight * 0.15;
                
                if (hostname) {
                    ctx.fillStyle = document.getElementById('color1').value;
                    ctx.font = `bold ${Math.floor(size * 0.055)}px Inter, sans-serif`;
                    ctx.fillText(hostname, size / 2, textY);
                    textY += size * 0.07;
                }
                if (responsable) {
                    ctx.fillStyle = document.getElementById('color4').value; // Color de acento
                    ctx.font = `bold ${Math.floor(size * 0.045)}px Inter, sans-serif`;
                    ctx.fillText(`Resp: ${responsable}`, size / 2, textY);
                }
            }

            // Renderizar la etiqueta del consecutivo inferior
            if (drawLabel) {
                const seqStr = getCurrentSequenceString();
                ctx.fillStyle = document.getElementById('color1').value; 
                ctx.font = `bold ${Math.floor(size * 0.05)}px Inter, monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Posicionar debajo del QR
                ctx.fillText(seqStr, size / 2, topLabelHeight + size + (bottomLabelHeight / 2));
            }
        }

        function drawModuleShape(ctx, x, y, size, shape) {
            const pad = shape === 'square' ? 0 : size * 0.05; 
            const drawSize = size - (pad * 2);
            const drawX = x + pad;
            const drawY = y + pad;

            ctx.beginPath();
            if (shape === 'circle') {
                ctx.arc(drawX + drawSize/2, drawY + drawSize/2, drawSize/2, 0, 2 * Math.PI);
            } else if (shape === 'rounded') {
                const radius = drawSize * 0.3;
                if(ctx.roundRect) { ctx.roundRect(drawX, drawY, drawSize, drawSize, radius); } 
                else { ctx.rect(drawX, drawY, drawSize, drawSize); }
            } else {
                ctx.rect(drawX, drawY, drawSize, drawSize);
            }
            ctx.fill();
        }

        function getLogoConfig(modulesCount) {
            const logoPercent = parseInt(document.getElementById('logoSize').value) / 100;
            const logoModules = Math.floor(modulesCount * logoPercent);
            const center = Math.floor(modulesCount / 2);
            const offset = Math.floor(logoModules / 2);
            return { start: center - offset - 1, end: center + offset + 1 };
        }

        function isInsideLogo(row, col, config) {
            return (row >= config.start && row <= config.end && col >= config.start && col <= config.end);
        }

        function renderLogo(ctx, totalSize, margin, renderSize, offsetY) {
            const logoPercent = parseInt(document.getElementById('logoSize').value) / 100;
            const logoDrawSize = renderSize * logoPercent;
            const center = totalSize / 2;
            const lx = center - (logoDrawSize / 2);
            const ly = offsetY + center - (logoDrawSize / 2);

            ctx.save();
            if (selectedIntegration === 'blend') {
                ctx.globalCompositeOperation = 'multiply';
            } else if (selectedIntegration === 'overlay') {
                const bgPadding = logoDrawSize * 0.1;
                ctx.fillStyle = document.getElementById('bgColor').value;
                ctx.beginPath();
                if(ctx.roundRect) {
                    ctx.roundRect(lx - bgPadding, ly - bgPadding, logoDrawSize + (bgPadding*2), logoDrawSize + (bgPadding*2), 8);
                } else {
                    ctx.fillRect(lx - bgPadding, ly - bgPadding, logoDrawSize + (bgPadding*2), logoDrawSize + (bgPadding*2));
                }
                ctx.fill();
            }

            ctx.drawImage(logoImage, lx, ly, logoDrawSize, logoDrawSize);
            ctx.restore();
        }

        function showMessage(text, type) {
            const container = document.getElementById('messages');
            container.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => container.innerHTML = '', 3000);
        }

        function downloadQR() {
            if (!currentQR) return;
            
            const canvas = document.getElementById('qrCanvas');
            const link = document.createElement('a');
            const isSeqEnabled = document.getElementById('enableSequence').checked;
            
            let filename = `qr_export_${new Date().getTime()}.png`;
            let successMsg = 'Exportación completada';

            if (isSeqEnabled) {
                const seqStr = getCurrentSequenceString();
                const hostname = document.getElementById('seqHostname').value.trim().replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const suffix = hostname ? `_${hostname}` : '';
                filename = `qr_${seqStr}${suffix}.png`;
                successMsg = `Exportado: ${filename}. Generando el siguiente...`;
            }

            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            showMessage(successMsg, 'success');

            // Lógica de Auto-incremento
            if (isSeqEnabled) {
                const seqInput = document.getElementById('seqValue');
                seqInput.value = parseInt(seqInput.value) + 1;
                generateQR();
            }
        }
    </script>
</body>
